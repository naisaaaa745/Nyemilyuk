<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#56351f">
  <title>Reset Password — Nyemil Yuk!</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">
  <header>
    <nav class="nav">
      <a class="brand" href="index.html"><span class="brand-mark"><img src="assets/images/mangkuk-merah.png" alt="Logo NyemilYuk!"></span><span>Nyemil<span style="color:#b17b27">Yuk!</span></span></a>
      <div class="navlinks"><a href="index.html">Katalog</a><a href="login.html">Login Admin</a></div>
      <a class="cart-pill" href="login.html">← Ke Login</a>
    </nav>
  </header>

  <main class="auth-wrap">
    <section class="auth-card">
      <div class="auth-logo"><img src="assets/images/mangkuk-merah.png" alt="Logo NyemilYuk!"></div>
      <div class="kicker">Pemulihan akun</div>
      <h1 id="resetTitle">Reset password</h1>
      <p class="auth-sub" id="resetSub">Masukkan email admin, kami akan mengirim tautan reset password.</p>

      <div class="auth-notice" id="authNotice" hidden></div>

      <form id="requestForm">
        <div class="auth-field">
          <label for="email">Email admin</label>
          <input id="email" type="email" autocomplete="username" maxlength="254" placeholder="admin@nyemilyuk.com" required>
        </div>
        <button class="auth-submit" type="submit">Kirim tautan reset →</button>
      </form>

      <form id="updateForm" hidden>
        <div class="auth-field">
          <label for="newPassword">Password baru</label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Minimal 8 karakter" required>
        </div>
        <div class="auth-field">
          <label for="confirmPassword">Ulangi password baru</label>
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Ketik ulang password" required>
        </div>
        <button class="auth-submit" type="submit">Simpan password →</button>
      </form>

      <div class="auth-links">
        <a href="login.html">← Kembali ke login</a>
        <a href="index.html">Katalog</a>
      </div>
    </section>
  </main>

  <footer>
    <strong style="font-size:17px">NyemilYuk! 🍜</strong><br>
    Tautan reset hanya dikirim ke email admin yang terdaftar.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/api.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
